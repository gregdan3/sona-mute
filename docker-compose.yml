services:
  postgres:
    image: postgres:alpine
    container_name: sona-mute_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./dbschema:/docker-entrypoint-initdb.d
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sonamute"]
      interval: 30s
      timeout: 90s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: sona-mute_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432 # uses container's port, not host's port
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${METABASE_USER}
      MB_DB_PASS: ${METABASE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 90s
      retries: 5
volumes:
  pgdata:
